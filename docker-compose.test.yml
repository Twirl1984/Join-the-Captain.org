# Isolierte TEST-Instanz auf dem VPS — parallel zu allem anderen.
# Start:  docker compose -p jtc-org-test -f docker-compose.test.yml up -d --build
# Web nur an 127.0.0.1:3100 (Zugriff per SSH-Tunnel, nichts öffentlich).
# Eigene DB + eigenes Volume → berührt weder .de noch eine spätere .org-Prod.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jtc_org
    volumes:
      - jtc_org_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jtc_org?sslmode=disable
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jtc_org_test_pgdata:

# Agentic-Engineering-Gate: PRs auf main sind erst mergefähig, wenn verify
# (Lint + Typecheck + Unit) UND Build UND die gemockten Navigation-E2E grün sind.
# (e2e/navigation-live.spec.ts braucht echtes Open-Meteo und läuft bewusst NICHT
# im Gate, sondern im Nightly-QA-Workflow gegen die Live-Instanz.)
name: agentic-gate
on:
  # ALLE PRs, nicht nur gegen main: auch gestapelte Feature-PRs (z. B. auf
  # feat/wetter-v2) müssen durchs Gate — sonst läuft verify nur auf Zuruf.
  pull_request:
  # UND jeder Push auf main: Fast-Forward-Merges (gh-Token kann keine PRs
  # erstellen) liefen sonst komplett am Gate vorbei.
  push:
    branches: [main]

jobs:
  # ── Diff-Größe: Review-Qualität schützen ────────────────────────────────────
  # Evidenz: Reviews finden 70–90 % der Defekte, solange der Diff klein bleibt;
  # SmartBear/Cisco-Studien zeigen den Bruch bei ~200–400 Zeilen — darüber sinkt
  # die Defect-Discovery-Rate steil ab (Reviewer "überfliegen" nur noch).
  # Deshalb: ≤400 grün · 400–800 Warnung · >800 blockend (Override via Label
  # "size-override", damit ein begründet großer Umbau nicht ausgebremst wird).
  # Lockfiles und generierte Dateien zählen NICHT mit — die liest niemand.
  diff-size:
    name: Diff-Groesse (Review-Qualitaet)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geaenderte Zeilen zaehlen (ohne Lockfiles/Generiertes)
        id: size
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin "${{ github.base_ref }}"
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          LINES=$(git diff --numstat "$BASE" HEAD -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)*.lock' \
            ':(exclude)docs/TRACEABILITY.md' \
            | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "Diff: $LINES Zeilen (Additions+Deletions, ohne Lockfiles/Generiertes)"
      - name: Bewerten
        env:
          LINES: ${{ steps.size.outputs.lines }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'size-override') }}
        run: |
          set -euo pipefail
          if [ "$LINES" -le 400 ]; then
            echo "::notice::Diff-Groesse ok ($LINES Zeilen)."
            exit 0
          fi
          if [ "$LINES" -le 800 ]; then
            echo "::warning::Grosser Diff ($LINES Zeilen). Ab ~400 Zeilen sinkt die Defect-Discovery-Rate im Review deutlich — bitte aufteilen."
            exit 0
          fi
          if [ "$OVERRIDE" = "true" ]; then
            echo "::warning::Sehr grosser Diff ($LINES Zeilen) — per Label 'size-override' bewusst freigegeben."
            exit 0
          fi
          echo "::error::Diff zu gross ($LINES Zeilen > 800). Bitte aufteilen oder das Label 'size-override' setzen."
          exit 1
      - name: Warn-Label setzen (best effort)
        if: steps.size.outputs.lines > 400
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label "grosser-diff"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: verify (Lint + Typecheck + Unit)
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Playwright-Browser (Chromium + WebKit — Device-Matrix REQ-PROC-004)
        run: npx playwright install --with-deps chromium webkit
      - name: E2E Navigation (gemockt, offline-stabil, 4 Geraete)
        run: npx playwright test e2e/navigation.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# Agentic-Engineering-Gate: PRs auf main sind erst mergefähig, wenn verify
# (Lint + Typecheck + Unit) UND Build UND die gemockten Navigation-E2E grün sind.
# (e2e/navigation-live.spec.ts braucht echtes Open-Meteo und läuft bewusst NICHT
# im Gate, sondern im Nightly-QA-Workflow gegen die Live-Instanz.)
name: agentic-gate
on:
  # ALLE PRs, nicht nur gegen main: auch gestapelte Feature-PRs (z. B. auf
  # feat/wetter-v2) müssen durchs Gate — sonst läuft verify nur auf Zuruf.
  pull_request:
  # UND jeder Push auf main: Fast-Forward-Merges (gh-Token kann keine PRs
  # erstellen) liefen sonst komplett am Gate vorbei.
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: verify (Lint + Typecheck + Unit)
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Playwright-Browser (Chromium + WebKit — Device-Matrix REQ-PROC-004)
        run: npx playwright install --with-deps chromium webkit
      - name: E2E Navigation (gemockt, offline-stabil, 4 Geraete)
        run: npx playwright test e2e/navigation.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
